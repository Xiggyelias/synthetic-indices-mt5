# ==============================================================================
# Docker Compose: QUANTA-SYNTH Stack (Dokploy / Coolify / Local Docker)
# ==============================================================================

version: "3.9"

services:
  quanta-synth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quanta-synth
    restart: unless-stopped
    ports:
      - "${PORT:-8501}:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - PORT=8501
    env_file:
      - .env
    volumes:
      # Persist state, logs, and configurations across redeployments
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
